# Production deploy.
#
# Fires on every push to main, which includes a PR being merged. Replaces the
# old process of a person running `vercel deploy --prod` from their laptop, so
# a release no longer depends on one machine's credentials.
#
# The build happens here rather than on Vercel (`--prebuilt`) so that anything
# we want to gate on (lint, tests) can run against the exact artifact that
# ships. Only files committed to the repo are deployed: untracked work in
# someone's working folder can no longer reach production by accident.
name: Deploy production

on:
  push:
    branches: [main]
  # Lets you re-run a release from the Actions tab without an empty commit.
  workflow_dispatch:

# Never let two production deploys race. A newer push supersedes an older one,
# but we let the in-flight deploy finish rather than leaving a half-shipped
# release, so this does NOT cancel in progress.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write   # the regeneration step commits rebuilt logo assets back

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and deploy to nammaoffice.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # --- client logos -------------------------------------------------
      # client-logos/ is the source of truth for the wall. Anyone can add a
      # client by dropping their artwork in there, or remove one by deleting
      # the file: this step rebuilds the processed images and the data file
      # from whatever is in that folder, so nobody needs Python installed or
      # has to touch generated code. Committing the result back keeps local
      # development in step with what shipped.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild client logos from client-logos/
        run: |
          pip install --quiet pillow numpy scipy
          python3 scripts/build-client-logos.py

      - name: Commit regenerated logos if they changed
        run: |
          if git diff --quiet -- public/images/clients lib/data/clients.json client-logos; then
            echo "Logos unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/clients lib/data/clients.json client-logos
          git commit -m "chore: rebuild client logos from client-logos/ [skip ci]"
          git push
          echo "Committed rebuilt logos."
      # ------------------------------------------------------------------

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Informational only. The repo currently has 4 pre-existing
      # react-hooks/set-state-in-effect errors; making this blocking today
      # would wedge every release. Drop continue-on-error once they are fixed
      # and this becomes a real gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Pull Vercel project settings and production env
        run: npx --yes vercel@58.9.0 pull --yes --environment=production --scope=uitpraveens-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes vercel@58.9.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy build output to production
        id: deploy
        run: |
          url=$(npx --yes vercel@58.9.0 deploy --prebuilt --prod --scope=uitpraveens-projects --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Verify the live site is serving the new build
        run: |
          set -e
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://nammaoffice.com/ || true)
            [ "$code" = "200" ] && { echo "nammaoffice.com -> 200"; exit 0; }
            echo "attempt $i: got $code, retrying"; sleep 10
          done
          echo "nammaoffice.com did not return 200 after the deploy"; exit 1

      - name: Summary
        run: |
          {
            echo "### Production deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Deployment | ${{ steps.deploy.outputs.url }} |"
            echo "| Live | https://nammaoffice.com |"
          } >> "$GITHUB_STEP_SUMMARY"
